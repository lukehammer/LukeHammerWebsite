<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B1020" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Sports" />
    <title>Luke Hammmer</title>
    <base href="/" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" href="icons/hammer-sports.png" />
    <link rel="apple-touch-icon" href="icons/hammer-sports.png" />
    <link href="css/bootstrap/bootstrap.min.css" rel="stylesheet" />
    <link href="css/bootstrap-icons/bootstrap-icons.min.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    <link href="Client.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">Loading...</div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="/js/sports-admin.js"></script>
    <script src="/js/schedule-auth.js"></script>
    <script src="/js/schedule-going-prefs.js"></script>
    <script src="/js/install-pwa.js"></script>
    <script src="/js/share-attendance.js"></script>
    <script src="/_framework/blazor.webassembly.js" autostart="false"></script>
    <script>
        (function () {
            function showBootFailure(message, err) {
                var app = document.getElementById('app');
                if (app) {
                    app.textContent = message;
                }
                if (err) {
                    console.error(err);
                }
            }

            function startBlazor() {
                if (typeof Blazor === 'undefined') {
                    showBootFailure(
                        'Could not load Blazor (/_framework/blazor.webassembly.js returned 404). Stop the Client dev server, run dotnet build on Client, dotnet run --no-build, then hard refresh (Ctrl+F5).');
                    return;
                }

                Blazor.start().catch(function (err) {
                    var detail = err && (err.message || String(err));
                    showBootFailure(
                        'The app failed to start. Try a hard refresh (Ctrl+F5). Stop and restart the Client project if you rebuilt while it was running, then reload.'
                        + (detail ? ' ' + detail : ''),
                        err);
                });
            }

            startBlazor();
        })();

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js');
        }
    </script>
</body>

</html>
