<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B1020" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Sports" />
    <title>Luke Hammmer</title>
    <base href="/" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" href="favicon-96x96.png?v=3" />
    <link rel="apple-touch-icon" href="apple-icon.png?v=3" />
    <link href="css/bootstrap/bootstrap.min.css" rel="stylesheet" />
    <link href="css/bootstrap-icons/bootstrap-icons.min.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    <link href="Client.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">Loading...</div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="/js/sports-admin.js"></script>
    <script src="/js/schedule-auth.js"></script>
    <script src="/js/schedule-going-prefs.js"></script>
    <script src="/js/install-pwa.js"></script>
    <script src="/js/share-attendance.js"></script>
    <script src="/_framework/blazor.webassembly.js" autostart="false"></script>
    <script>
        (function () {
            function showBootFailure(message, err) {
                var app = document.getElementById('app');
                if (app) {
                    app.textContent = message;
                }
                if (err) {
                    console.error(err);
                }
            }

            function applySiteIcon() {
                var path = location.pathname.replace(/\/+$/, '').toLowerCase();
                var sports = path === '/sports';
                var familyEvents = path === '/familyevents' || path.indexOf('/familyevents/') === 0;
                var icon = document.querySelector('link[rel="icon"]');
                var apple = document.querySelector('link[rel="apple-touch-icon"]');
                var manifest = document.querySelector('link[rel="manifest"]');
                var appTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
                var sportsIcon = 'icons/hammer-sports.png';
                if (icon) {
                    icon.href = familyEvents ? 'icons/hammer-family-events-96.png'
                        : sports ? sportsIcon
                        : 'favicon-96x96.png?v=3';
                }
                if (apple) {
                    apple.href = familyEvents ? 'icons/hammer-family-events-180.png'
                        : sports ? sportsIcon
                        : 'apple-icon.png?v=3';
                }
                if (manifest) {
                    manifest.href = familyEvents ? 'manifest-family-events.json' : 'manifest.json';
                }
                if (appTitle) {
                    appTitle.content = familyEvents ? 'Family Events' : 'Sports';
                }
            }

            function startBlazor() {
                if (typeof Blazor === 'undefined') {
                    showBootFailure(
                        'Could not load Blazor (/_framework/blazor.webassembly.js returned 404). Stop the Client dev server, run dotnet build on Client, dotnet run --no-build, then hard refresh (Ctrl+F5).');
                    return;
                }

                applySiteIcon();
                Blazor.start().then(function () {
                    function watch(methodName) {
                        var original = history[methodName];
                        history[methodName] = function () {
                            var result = original.apply(history, arguments);
                            applySiteIcon();
                            return result;
                        };
                    }
                    watch('pushState');
                    watch('replaceState');
                    window.addEventListener('popstate', applySiteIcon);
                    applySiteIcon();
                }).catch(function (err) {
                    var detail = err && (err.message || String(err));
                    showBootFailure(
                        'The app failed to start. Try a hard refresh (Ctrl+F5). Stop and restart the Client project if you rebuilt while it was running, then reload.'
                        + (detail ? ' ' + detail : ''),
                        err);
                });
            }

            startBlazor();
        })();

        window.photoshootSetPasswordCookie = function (value) {
            var secure = location.protocol === 'https:' ? '; Secure' : '';
            if (!value) {
                document.cookie = 'photoshoot_password=; Path=/; Max-Age=0; SameSite=Lax' + secure;
                return;
            }
            document.cookie = 'photoshoot_password=' + encodeURIComponent(value) + '; Path=/; Max-Age=2592000; SameSite=Lax' + secure;
        };

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });
            var refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', function () {
                if (refreshing) {
                    return;
                }
                refreshing = true;
                window.location.reload();
            });
        }
    </script>
</body>

</html>
